[tool]
id = "com.thelightphone.sonycontrol"
label = "Sony"
versionCode = 7
versionName = "0.4.0"
# BLUETOOTH_CONNECT lets the tool enumerate already-paired devices and open an
# RFCOMM (SPP) socket to the earbuds' Sony service. Pair the earbuds in the
# system Bluetooth settings first; this tool does not scan/discover, so it does
# not need BLUETOOTH_SCAN. Brokered entirely by the SDK's LightBluetoothSerial
# (app code never touches android.bluetooth directly).
# INTERNET is needed only to fetch Sony's firmware feed (info.update.sony.net)
# and the firmware binary; no other network traffic.
permissions = ["android.permission.BLUETOOTH_CONNECT", "android.permission.INTERNET"]
# change if you run this on the emulator!
# serverPackage = "com.thelightphone.sdk.emulator"
serverPackage = "com.lightos"
